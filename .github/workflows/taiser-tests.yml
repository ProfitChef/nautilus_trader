# Rust tests of the cherry-picked upstream fixes on top of 2.0.0rc6 (fork-only workflow).
# cargo-nextest runs each test in its own process, as upstream CI does: the live crate's serial
# tests register a global logger and fail under plain `cargo test`.
name: taiser-tests

on:
  workflow_dispatch:
  push:
    branches: [taiser/rc6-upstream-fixes-tests]

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: System packages
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y clang lld pkg-config python3-dev libpython3-dev -o Acquire::Retries=5
      - name: Cap'n Proto
        env:
          CAPNP_PREFIX: ${{ github.workspace }}/.cache/capnp
        run: |
          export PATH="$CAPNP_PREFIX/bin:$PATH"
          bash scripts/install-capnp.sh
          echo "$CAPNP_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Rust toolchain
        run: |
          TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - name: cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: OKX adapter (amendments fix and the rest of the crate)
        run: cargo nextest run --locked -p nautilus-okx --no-fail-fast
      - name: Reconciliation (average price fix)
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p nautilus-execution --no-fail-fast -E 'test(reconciliation)'
      - name: Live node and execution manager
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p nautilus-live --no-fail-fast
