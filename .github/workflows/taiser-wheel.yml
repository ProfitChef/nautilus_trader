# Wheel build for 2.0.0rc6 + two upstream develop fixes cherry-picked (fork-only workflow):
# c9d6b25bd (reconciliation average price precision, #5276) and fb2a2b7c3 (OKX conditional
# order amendments, #5275).
#
# Builds the Python 3.13 wheels this branch ships to its consumer (Linux x86_64 for production,
# macOS arm64 for local testing) and publishes them as a GitHub release with SHA-256 sums.
# Release profile with thin LTO and more codegen units than upstream's fat LTO: same opt-level
# and panic strategy, fits GitHub-hosted runners.
name: taiser-wheel

on:
  workflow_dispatch:
  push:
    branches: [taiser/rc6-upstream-fixes]

permissions:
  contents: read

concurrency:
  group: taiser-wheel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y clang lld pkg-config python3-dev libpython3-dev -o Acquire::Retries=5

      - name: Cap'n Proto (Linux)
        if: runner.os == 'Linux'
        env:
          CAPNP_PREFIX: ${{ github.workspace }}/.cache/capnp
        run: |
          # The install script checks the installed version through PATH.
          export PATH="$CAPNP_PREFIX/bin:$PATH"
          bash scripts/install-capnp.sh
          echo "$CAPNP_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Cap'n Proto (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust toolchain
        run: |
          TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
          rustc --version

      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==$(bash ../scripts/maturin-version.bash)"
          if [ "$RUNNER_OS" = "Linux" ]; then python -m pip install patchelf; fi
          maturin build --locked --release -i python3.13 --out ../dist
          ls -la ../dist

      - name: Smoke test
        run: |
          python -m pip install dist/*.whl
          python -c "import nautilus_trader as nt; print(nt.__version__); assert nt.__version__ == '2.0.0rc6+taiser.2'; from nautilus_trader.adapters.okx import OKXExecutionClientFactory, OKXDataClientFactory"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 30

  rust-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: System packages
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y clang lld pkg-config python3-dev libpython3-dev -o Acquire::Retries=5
      - name: Cap'n Proto
        env:
          CAPNP_PREFIX: ${{ github.workspace }}/.cache/capnp
        run: |
          export PATH="$CAPNP_PREFIX/bin:$PATH"
          bash scripts/install-capnp.sh
          echo "$CAPNP_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Rust toolchain
        run: |
          TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - name: cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest runs each test in its own process, as upstream CI does: the live crate's serial
      # tests register a global logger and fail under plain `cargo test`.
      - name: OKX adapter
        run: cargo nextest run --locked -p nautilus-okx --no-fail-fast
      - name: Reconciliation
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p nautilus-execution --no-fail-fast -E 'test(reconciliation)'
      - name: Live node and execution manager
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p nautilus-live --no-fail-fast

  # A release is immutable: consumers pin its wheels by SHA-256, and a rebuild is not byte-identical.
  # It is published only by a manual dispatch, after wheels and tests pass, and never replaced –
  # a rebuild ships under a new version (taiser.N+1).
  release:
    needs: [wheel, rust-tests]
    if: ${{ success() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml | head -1)"
          TAG="v${VERSION/+/-}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG already exists – releases are immutable, bump the version"; exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "$VERSION" \
            --notes "nautilus_trader 2.0.0rc6 with two upstream develop fixes cherry-picked: c9d6b25bd (reconciliation keeps off-tick average prices, #5276) and fb2a2b7c3 (OKX conditional order amendments via amend-algos, #5275). Built from ${{ github.sha }}. SHA-256 sums in SHA256SUMS."
