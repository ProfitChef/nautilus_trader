# Wheel build for the 2.0.0rc6 + OKX avg_px_open_precision patch (fork-only workflow).
#
# Builds the Python 3.13 wheels this branch ships to its consumer (Linux x86_64 for production,
# macOS arm64 for local testing) and publishes them as a GitHub release with SHA-256 sums.
# Release profile with thin LTO and more codegen units than upstream's fat LTO: same opt-level
# and panic strategy, fits GitHub-hosted runners.
name: taiser-wheel

on:
  workflow_dispatch:
  push:
    branches: [taiser/rc6-okx-avgpx]

permissions:
  contents: read

concurrency:
  group: taiser-wheel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y clang lld pkg-config python3-dev libpython3-dev -o Acquire::Retries=5

      - name: Cap'n Proto (Linux)
        if: runner.os == 'Linux'
        env:
          CAPNP_PREFIX: ${{ github.workspace }}/.cache/capnp
        run: |
          # The install script checks the installed version through PATH.
          export PATH="$CAPNP_PREFIX/bin:$PATH"
          bash scripts/install-capnp.sh
          echo "$CAPNP_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Cap'n Proto (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust toolchain
        run: |
          TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
          rustc --version

      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==$(bash ../scripts/maturin-version.bash)"
          if [ "$RUNNER_OS" = "Linux" ]; then python -m pip install patchelf; fi
          maturin build --locked --release -i python3.13 --out ../dist
          ls -la ../dist

      - name: Smoke test
        run: |
          python -m pip install dist/*.whl
          python -c "import nautilus_trader as nt; print(nt.__version__); assert nt.__version__ == '2.0.0rc6+taiser.1'; from nautilus_trader.adapters.okx import OKXExecutionClientFactory, OKXDataClientFactory"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 30

  release:
    needs: wheel
    if: ${{ success() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.0rc6-taiser.1"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "2.0.0rc6+taiser.1" \
            --notes "nautilus_trader 2.0.0rc6 with one OKX fix: position status reports carry avg_px_open_precision = instrument price precision, so startup reconciliation accepts OKX avgPx that is off the price tick. Built from ${{ github.sha }}. SHA-256 sums in SHA256SUMS."
